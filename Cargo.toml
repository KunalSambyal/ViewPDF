[package]
name = "ViewPDF"
version = "0.1.0"
edition = "2021"

[dependencies]
# No default features: skips the `image` crate and the thread-safety mutex
# (pdfium is only ever touched from one worker thread).
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest"] }
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
